<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Janela</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        img {
            width: 300px;
            height: auto;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1 id="titulo">Abra a Janela</h1>
    
    <img 
        id="janela" 
        src="janelafechada.jpg" 
        alt="Janela"
        onmouseover="mouseSobre()" 
        onmouseout="mouseFora()" 
        onclick="cliqueJanela()"
    >

    <script>
        const titulo = document.getElementById('titulo');
        const janela = document.getElementById('janela');
        let quebrada = false;

        function mouseSobre() {
            if (!quebrada) {
                janela.src = "janelaaberta.jpg";
                titulo.innerText = "Janela aberta";
            }
        }

        function mouseFora() {
            if (!quebrada) {
                janela.src = "janelafechada.jpg";
                titulo.innerText = "Janela Fechada";
            }
        }

        function cliqueJanela() {
            quebrada = true;
            janela.src = "janeaquebrada.jpg";
            titulo.innerText = "Janela Quebrada";
            
            // Remove os eventos para travar o estado de quebrada
            janela.onmouseover = null;
            janela.onmouseout = null;
        }
    </script>

</body>
</html>
