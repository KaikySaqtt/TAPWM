<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
    <script src="Exercicio.js"></script>
    <style>
        body {
            background-color: #ffe6f0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        form {
            background-color: #fff0f5;
            border: 3px solid #ffb6c1;
            border-radius: 20px;
            padding: 30px;
            width: 300px;
            box-shadow: 0 8px 16px rgba(255, 182, 193, 0.4);
        }

        label {
            display: block;
            color: #d6336c;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 2px solid #ffc2d6;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #ff85a2;
        }

        h4,
        h5 {
            color: #d6336c;
        }

        #text {
            display: block;
            text-align: center;
            color: #d6336c;
            font-weight: bold;
            margin-top: 10px;
            min-height: 20px;
        }

        div {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        button {
            background-color: #ff8fab;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #ff6f91;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <form id="Formulario" name="Formulario">
        <label for="">Nome</label>
        <input id="name" name="name" maxlength="10" type="text">
        <label for="">Email</label>
        <input type="email" name="email" id="email">
        <label for="">Comentário</label>
        <input type="text" id="comentario" minlength="20">
        <h4 style="text-align: center; font-weight: bold;">Pergunta</h4>
        <h5 style="text-align: center; font-weight: bold;">Você ja visitou o site?</h5>
        <label id="text"></label>
        <div>
            <button type="button" onclick="Sim()">Sim</button>
            <button type="button" onclick="Nao()">Não</button>
        </div>
        <button style="margin-left: 36%; margin-top: 10px;" type="submit">Enviar</button>
    </form>
</body>

</html>
